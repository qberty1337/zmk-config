[package]
name = "corne-battery"
version = "0.1.0"
edition = "2021"
description = "Windows tray icon showing both Corne halves' battery levels, read over USB from the ZMK dongle"

[dependencies]
# windows-native: pure-Rust HID backend, so no C compiler is needed
hidapi = { version = "2", default-features = false, features = ["windows-native"] }
tray-icon = "0.26"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Console"] }

[profile.release]
strip = true
