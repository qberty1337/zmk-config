# Dongle (split central, plugged into the PC)
### ZMK Studio (build.yaml adds the studio-rpc-usb-uart snippet)
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

### Report both halves' battery levels to the host
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

### Mouse reports for the right half's trackpad
CONFIG_ZMK_POINTING=y

### Both halves' battery levels over USB, for tools/corne-battery (src/battery_hid.c)
CONFIG_CORNE_BATTERY_HID=y
CONFIG_USB_HID_DEVICE_COUNT=2
