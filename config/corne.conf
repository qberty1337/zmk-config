# Applies to every corne part (left, right, dongle).
# Part-specific settings: corne_left.conf (display), corne_right.conf, corne_dongle.conf (central).

### Bluetooth
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Connection-stability + security settings planned to become ZMK defaults
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

### Power
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_EXT_POWER=y
# 15 min idle -> deep sleep (a key press on that part wakes it)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
# 2 min idle -> idle state
CONFIG_ZMK_IDLE_TIMEOUT=120000

### Keys
# Eager press debounce for lower latency
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

### Improves compatibility with iPad (https://zmk.dev/docs/config/system#hid)
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

### Debug
# CONFIG_ZMK_USB_LOGGING=y
